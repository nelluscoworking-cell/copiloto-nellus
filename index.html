<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071b2b">
<title>NL Sales</title>

<style>
:root{
  --navy:#071b2b;
  --navy2:#0d2940;
  --bg:#f5f7fa;
  --white:#fff;
  --text:#17212b;
  --muted:#718096;
  --line:#e5eaf0;
  --green:#18a77a;
  --blue:#2563eb;
  --orange:#f59e0b;
  --red:#e05252;
  --yellow:#d4a72c;
  --shadow:0 8px 28px rgba(15,31,45,.07);
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input,textarea{font:inherit}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:238px;
  background:var(--navy);
  color:#d9e5ee;
  padding:22px 14px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 10px 24px;
  font-size:19px;
  font-weight:900;
}

.logo-icon{
  width:36px;
  height:36px;
  border-radius:10px;
  background:var(--green);
  display:grid;
