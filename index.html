const monthLabel = (key) => {

  const [y, m] =
key.split("-");

  const names =
["jan", "fev", "mar", "abr",
"mai", "jun", "jul", "ago",
"set", "out", "nov", "dez"];

  return
`${names[parseInt(m, 10) - 1]}/${y.slice(2)}`;

};

const dateLabel = (iso) => {

  const [y, m, d] =
iso.split("-");

  return
`${d}/${m}/${y}`;

};

function uid(prefix) {

  return prefix +
Math.random().toString(36).slice(2, 9);

}

        <div

      </div>

    </div>

  );

}

function Agenda({ bookings, clients, onAdd, onRemove, typeLabels = DEFAULT_TYPE_LABEL }) {

  const [activeDate,
setActiveDate] = useState("2026-09-01");

  const [showForm,
setShowForm] = useState(false);

  const [draft,
setDraft] = useState({

    clientId:
clients[0]?.id || "",

    
    guestName: "",
date:
"2026-09-01",

    start:
"09:00",

    end:
"10:00",

    room:
"",

    notes:
"",

  });

  const dates =
useMemo(() => {

    const set = new
Set(bookings.map((b) => b.date));

   
set.add(activeDate);

    return
Array.from(set).sort();

  }, [bookings,
activeDate]);

  const dayBookings =
bookings

    .filter((b) =>
b.date === activeDate)

    .sort((a, b) =>
a.start.localeCompare(b.start));

  const weekdayFmt =
(iso) => {

    const d = new
Date(iso + "T12:00:00");

    return
d.toLocaleDateString("pt-BR", { weekday: "short", day:
"2-digit", month: "short" });

  };

  const submit = (e)
=> {

   
e.preventDefault();

    if
(!draft.room) return;

    onAdd({ ...draft,
id: uid("b") });

   
setShowForm(false);

    setActiveDate(draft.date);

    setDraft({
clientId: clients[0]?.id || "", guestName: "", date: draft.date, start:
"09:00", end: "10:00", room: "", notes:
"" });

  };

  return (

    <div
className="view">

      <div
className="view-head">

        <div>

         
<h2>Agenda</h2>

         
<p>Reservas de estações, salas e horários do coworking.</p>

        </div>

        <button
className="btn-primary" onClick={() => setShowForm(true)}>

          <Plus
size={16} /> Novo agendamento

       
</button>

      </div>

      <div className="date-rail">

        {dates.map((d)
=> (

          <button

            key={d}

           
className={"date-chip" + (d === activeDate ? "
active" : "")}

           
onClick={() => setActiveDate(d)}

          >

           
{weekdayFmt(d)}

          </button>

        ))}

      </div>

      <div
className="agenda-list">

       
{dayBookings.length === 0 && (

          <div
className="empty-state">

           
<CalendarDays size={22} />

           
<p>Nenhum agendamento para este dia.</p>

          </div>

        )}

       
{dayBookings.map((b) => {

          const client
= clients.find((c) => c.id === b.clientId);

          return (

            <div
className="agenda-row" key={b.id}>

              <div
className="agenda-time">

               
<Clock size={14} />

               
{b.start} – {b.end}

             
</div>

              <div
className="agenda-main">

               
<strong>{client ? client.name : (b.guestName || "Cliente não informado")}</strong>

               
<span>{b.room}{b.notes ? ` · ${b.notes}` :
""}</span>

             
</div>

              {client && <TypeBadge type={client.type} typeLabels={typeLabels} />}

             
<button className="icon-btn ghost" onClick={() =>
onRemove(b.id)} aria-label="Remover">

               
<Trash2 size={16} />

              </button>

           
</div>

          );

        })}

      </div>

      {showForm
&& (

        <Modal
title="Novo agendamento" onClose={() => setShowForm(false)}>

          <form
className="form" onSubmit={submit}>

            <Field
label="Cliente">

             
<select
                value={draft.clientId}
                onChange={(e) => setDraft({ ...draft, clientId: e.target.value, guestName: e.target.value ? "" : draft.guestName })}
              >
                <option value="">Cliente não cadastrado / avulso</option>
                {clients.map((c) => (
                  <option key={c.id} value={c.id}>{c.name}</option>
                ))}
              </select>

           
</Field>

            {!draft.clientId && (
              <Field label="Nome do cliente / visitante (opcional)">
                <input placeholder="Ex.: Visitante ou empresa" value={draft.guestName} onChange={(e) => setDraft({ ...draft, guestName: e.target.value })} />
              </Field>
            )}

            <div
className="form-row">

             
<Field label="Data">

               
<input type="date" value={draft.date} onChange={(e) =>
setDraft({ ...draft, date: e.target.value })} />

             
</Field>

             
<Field label="Início">

               
<input type="time" value={draft.start} onChange={(e) =>
setDraft({ ...draft, start: e.target.value })} />

             
</Field>

             
<Field label="Fim">

               
<input type="time" value={draft.end} onChange={(e) =>
setDraft({ ...draft, end: e.target.value })} />

             
</Field>

            </div>

            <Field
label="Espaço / estação">

             
<input

               
placeholder="Ex.: Estação 4, Sala de reunião..."

               
value={draft.room}

               
onChange={(e) => setDraft({ ...draft, room: e.target.value })}

              />

           
</Field>

            <Field
label="Observações (opcional)">

             
<input value={draft.notes} onChange={(e) => setDraft({ ...draft,
notes: e.target.value })} />

           
</Field>

            <button
className="btn-primary full" type="submit">

              Salvar
agendamento

           
</button>

         
</form>

        </Modal>

      )}

    </div>

  );

}

function Clientes({ clients, onAdd, onRemove, typeLabels = DEFAULT_TYPE_LABEL }) {

  const [filter,
setFilter] = useState("todos");

  const [query,
setQuery] = useState("");

  const [showForm,
setShowForm] = useState(false);

  const [draft,
setDraft] = useState({

    name:
"",

    document:
"",

    address:
"",

    type:
"presencial",

    phone:
"",

    email:
"",

  });

  const counts =
useMemo(() => {

    const c = {
presencial: 0, salaFixa: 0, virtual: 0 };

    clients.forEach((cl) => c[cl.type]++);

    return c;

  }, [clients]);

  const filtered =
clients.filter((c) => {

    const matchesType
= filter === "todos" || c.type === filter;

    const q =
query.trim().toLowerCase();

    const matchesQuery
= !q || (c.name || "").toLowerCase().includes(q) || (c.document || "").includes(q);

    return matchesType
&& matchesQuery;

  });

  const submit = (e)
=> {

   
e.preventDefault();

    // Todos os campos são opcionais; o cadastro pode ser concluído incompleto.

    onAdd({ ...draft,
id: uid("c"), since: "2026-09-01" });

   
setShowForm(false);

    setDraft({ name:
"", document: "", address: "", type:
"presencial", phone: "", email: "" });

  };

  return (

    <div
className="view">

      <div
className="view-head">

        <div>

          <h2>Clientes</h2>

         
<p>Cadastro e segmentação por tipo de contrato.</p>

        </div>

        <button
className="btn-primary" onClick={() => setShowForm(true)}>

          <Plus
size={16} /> Novo cliente

       
</button>

      </div>

      <div
className="segment-cards">

       
{["presencial", "salaFixa",
"virtual"].map((t) => (

          <button

            key={t}

           
className={"segment-card" + (filter === t ? "
active" : "")}

            style={{
"--dot": TYPE_DOT[t] }}

           
onClick={() => setFilter(filter === t ? "todos" : t)}

          >

            <span
className="segment-count">{counts[t]}</span>

            <span
className="segment-label">{typeLabels[t] || DEFAULT_TYPE_LABEL[t]}</span>

         
</button>

        ))}

      </div>

      <div className="toolbar">

        <div
className="search-box">

          <Search
size={16} />

          <input

           
placeholder="Buscar por nome ou CPF/CNPJ..."

           
value={query}

           
onChange={(e) => setQuery(e.target.value)}

          />

        </div>

        {filter !==
"todos" && (

          <button
className="chip-clear" onClick={() =>
setFilter("todos")}>

            Limpar
filtro · {typeLabels[filter] || DEFAULT_TYPE_LABEL[filter]} <X size={13} />

         
</button>

        )}

      </div>

      <div className="client-grid">

       
{filtered.length === 0 && (

          <div
className="empty-state">

            <Users
size={22} />

           
<p>Nenhum cliente encontrado.</p>

        )}

       
{filtered.map((c) => (

          <div
className="client-card" key={c.id}>

            <div
className="client-card-top">

             
<div>

               
<strong>{c.name}</strong>

</div>

              <TypeBadge
type={c.type} />

           
</div>

className="client-line">

             
<MapPin size={14} />

             
<span>{c.address}</span>

&& (

className="client-line">

label="Nome / Razão social">

className="btn-primary full" type="submit">

             
Cadastrar cliente

           
</button>

         
</form>

        </Modal>

      )}

    </div>

  );

}

function Financeiro({ tx, onAdd, onRemove }) {

  const [showForm,
setShowForm] = useState(false);

  const [draft,
setDraft] = useState({

    type:
"entrada",

    desc:
"",

    amount:
"",

    date:
"2026-09-01",

    category:
"",

  });

  const totals =
useMemo(() => {

    const entradas =
tx.filter((t) => t.type === "entrada").reduce((s, t) => s +
t.amount, 0);

    const saidas =
tx.filter((t) => t.type === "saida").reduce((s, t) => s +
t.amount, 0);

    return { entradas,
saidas, saldo: entradas - saidas };

  }, [tx]);

  const monthly =
useMemo(() => {

    const map = {};

    tx.forEach((t)
=> {

      const key =
t.date.slice(0, 7);

      if (!map[key])
map[key] = { key, entradas: 0, saidas: 0 };

      if (t.type ===
"entrada") map[key].entradas += t.amount;

      else
map[key].saidas += t.amount;

    });

    return

    doc.save(`relatorio-financeiro-${new Date().toISOString().slice(0, 10)}.pdf`);

// Gestor — follow-ups, lembretes e tarefas comerciais
// ---------------------------------------------------------------------------

const FOLLOWUP_TYPES = [
  { value: "responder", label: "Responder cliente", icon: MessageCircle },
  { value: "followup", label: "Fazer follow-up", icon: RefreshCw },
  { value: "ligar", label: "Ligar", icon: Phone },
  { value: "proposta", label: "Enviar proposta", icon: Send },
  { value: "documento", label: "Enviar documento", icon: FileText },
  { value: "pagamento", label: "Cobrar pagamento", icon: DollarSign },
  { value: "confirmar", label: "Confirmar reserva", icon: CalendarClock },
  { value: "outro", label: "Outro", icon: ListTodo },
];

const PRIORITIES = {
  alta: { label: "Alta", className: "priority-high" },
  media: { label: "Média", className: "priority-medium" },
  baixa: { label: "Baixa", className: "priority-low" },
};

const STATUS_META = {
  pending: { label: "Pendente", className: "status-pending" },
  waiting: { label: "Aguardando", className: "status-waiting" },
  completed: { label: "Concluído", className: "status-completed" },
};

function todayISO() {
  const d = new Date();
  const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return local.toISOString().slice(0, 10);
}

function currentTime() {
  return new Date().toTimeString().slice(0, 5);
}

function FollowupTypeIcon({ type, size = 15 }) {
  const item = FOLLOWUP_TYPES.find((x) => x.value === type) || FOLLOWUP_TYPES[FOLLOWUP_TYPES.length - 1];
  const Icon = item.icon;
  return <Icon size={size} />;
}

function Gestor({ clients, followups, onChange, onAddClient }) {
  const [filter, setFilter] = useState("todos");
  const [query, setQuery] = useState("");
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [notificationsEnabled, setNotificationsEnabled] = useState(false);
  const [draft, setDraft] = useState({
    clientId: "",
    guestName: "",
    subject: "",
    notes: "",
    date: todayISO(),
    time: "10:00",
    priority: "media",
    type: "followup",
    status: "pending",
    repeat: "none",
  });

  const today = todayISO();
  const nowTime = currentTime();

  const getClientName = (f) => {
    const c = clients.find((x) => x.id === f.clientId);
    return c ? c.name : (f.guestName || "Cliente avulso");
  };

  const computed = useMemo(() => {
    const pending = followups.filter((f) => f.status !== "completed");
    const overdue = pending.filter((f) => f.date < today || (f.date === today && (f.time || "23:59") < nowTime));
    const todayItems = pending.filter((f) => f.date === today && !overdue.some((x) => x.id === f.id));
    const waiting = followups.filter((f) => f.status === "waiting");
    const completedToday = followups.filter((f) => f.status === "completed" && (f.completedAt || "").slice(0, 10) === today);
    return { pending, overdue, todayItems, waiting, completedToday };
  }, [followups, today, nowTime]);

  useEffect(() => {
    const check = () => {
      if (!notificationsEnabled || !("Notification" in window) || Notification.permission !== "granted") return;
      const due = followups.filter((f) => f.status === "pending" && f.date === todayISO() && (f.time || "23:59") <= currentTime());
      const last = sessionStorage.getItem("nellus-last-notification-minute");
      const minute = new Date().toISOString().slice(0, 16);
      if (due.length && last !== minute) {
        sessionStorage.setItem("nellus-last-notification-minute", minute);
        new Notification("Nellus Gestor", { body: `Você tem ${due.length} tarefa${due.length > 1 ? "s" : ""} pendente${due.length > 1 ? "s" : ""}.` });
      }
    };
    check();
    const timer = setInterval(check, 30000);
    return () => clearInterval(timer);
  }, [followups, notificationsEnabled]);

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    return [...followups]
      .filter((f) => {
        const overdue = f.status !== "completed" && (f.date < today || (f.date === today && (f.time || "23:59") < nowTime));
        const isToday = f.date === today && !overdue && f.status !== "completed";
        const matchesFilter =
          filter === "todos" ||
          (filter === "atrasados" && overdue) ||
          (filter === "hoje" && isToday) ||
          (filter === "aguardando" && f.status === "waiting") ||
          (filter === "concluidos" && f.status === "completed");
        const text = `${getClientName(f)} ${f.subject || ""} ${f.notes || ""}`.toLowerCase();
        return matchesFilter && (!q || text.includes(q));
      })
      .sort((a, b) => {
        if (a.status === "completed" && b.status !== "completed") return 1;
        if (a.status !== "completed" && b.status === "completed") return -1;
        return `${a.date} ${a.time || ""}`.localeCompare(`${b.date} ${b.time || ""}`);
      });
  }, [followups, filter, query, today, nowTime, clients]);

  const resetDraft = () => setDraft({ clientId: "", guestName: "", subject: "", notes: "", date: todayISO(), time: "10:00", priority: "media", type: "followup", status: "pending", repeat: "none" });
  const openNew = () => { resetDraft(); setEditing(null); setShowForm(true); };
  const openEdit = (f) => {
    setEditing(f.id);
    setDraft({ clientId: f.clientId || "", guestName: f.guestName || "", subject: f.subject || "", notes: f.notes || "", date: f.date || today, time: f.time || "10:00", priority: f.priority || "media", type: f.type || "followup", status: f.status || "pending", repeat: f.repeat || "none" });
    setShowForm(true);
  };
  const save = (e) => {
    e.preventDefault();
    if (!draft.subject.trim() || !draft.date) return;
    const base = { ...draft, subject: draft.subject.trim(), notes: draft.notes.trim(), id: editing || uid("f"), createdAt: editing ? (followups.find((f) => f.id === editing)?.createdAt || new Date().toISOString()) : new Date().toISOString() };
    if (draft.clientId) base.guestName = "";
    if (editing) onChange(followups.map((f) => f.id === editing ? { ...f, ...base } : f));
    else onChange([base, ...followups]);
    setShowForm(false); setEditing(null); resetDraft();
  };
  const complete = (id) => {
    const item = followups.find((f) => f.id === id);
    if (!item) return;
    const updated = followups.map((f) => f.id === id ? { ...f, status: "completed", completedAt: new Date().toISOString() } : f);
    if (item.repeat && item.repeat !== "none") {
      const base = new Date(item.date + "T12:00:00");
      if (item.repeat === "daily") base.setDate(base.getDate() + 1);
      if (item.repeat === "weekly") base.setDate(base.getDate() + 7);
      if (item.repeat === "monthly") base.setMonth(base.getMonth() + 1);
      const nextDate = base.toISOString().slice(0, 10);
      updated.unshift({ ...item, id: uid("f"), date: nextDate, status: "pending", completedAt: "", createdAt: new Date().toISOString() });
    }
    onChange(updated);
  };
  const reopen = (id) => onChange(followups.map((f) => f.id === id ? { ...f, status: "pending", completedAt: "" } : f));
  const remove = (id) => { if (window.confirm("Excluir este follow-up?")) onChange(followups.filter((f) => f.id !== id)); };
  const enableNotifications = async () => {
    if (!("Notification" in window)) { alert("Seu navegador não oferece notificações neste dispositivo."); return; }
    const permission = await Notification.requestPermission();
    setNotificationsEnabled(permission === "granted");
    if (permission === "granted") new Notification("Nellus Gestor", { body: "As notificações de tarefas estão ativadas enquanto o sistema estiver aberto." });
  };

  return (
    <div className="view gestor-view">
      <div className="view-head gestor-head">
        <div><div className="eyebrow"><Bell size={15} /> CENTRAL DE AÇÕES</div><h2>Gestor</h2><p>Acompanhe seus follow-ups, lembretes e tarefas do dia.</p></div>
        <div className="header-actions"><button className={"btn-secondary notification-btn" + (notificationsEnabled ? " enabled" : "")} onClick={enableNotifications}><BellRing size={16} /> {notificationsEnabled ? "Notificações ativas" : "Ativar notificações"}</button><button className="btn-primary" onClick={openNew}><Plus size={16} /> Novo follow-up</button></div>
      </div>
      <div className="gestor-stats">
        <button className="gestor-stat overdue" onClick={() => setFilter("atrasados")}><span className="gestor-stat-icon"><AlertCircle size={21} /></span><span><b>Ações atrasadas</b><strong>{computed.overdue.length}</strong><small>Precisam da sua atenção</small></span><ChevronRight size={17} /></button>
        <button className="gestor-stat today" onClick={() => setFilter("hoje")}><span className="gestor-stat-icon"><Clock3 size={21} /></span><span><b>Para fazer hoje</b><strong>{computed.todayItems.length}</strong><small>Follow-ups e tarefas</small></span><ChevronRight size={17} /></button>
        <button className="gestor-stat waiting" onClick={() => setFilter("aguardando")}><span className="gestor-stat-icon"><UsersRound size={21} /></span><span><b>Aguardando clientes</b><strong>{computed.waiting.length}</strong><small>Sem retorno ainda</small></span><ChevronRight size={17} /></button>
        <button className="gestor-stat done" onClick={() => setFilter("concluidos")}><span className="gestor-stat-icon"><CheckCircle size={21} /></span><span><b>Concluídos hoje</b><strong>{computed.completedToday.length}</strong><small>Tarefas finalizadas</small></span><ChevronRight size={17} /></button>
      </div>
      <div className="gestor-layout">
        <section className="gestor-panel">
          <div className="gestor-panel-head"><div><h3>Minhas Tarefas e Follow-ups</h3><span className="muted">Tudo que precisa da sua atenção comercial.</span></div><div className="gestor-tools"><div className="search-box"><Search size={15} /><input placeholder="Buscar cliente, assunto ou observação..." value={query} onChange={(e) => setQuery(e.target.value)} /></div><button className="btn-secondary" onClick={() => setFilter(filter === "todos" ? "hoje" : "todos")}><Filter size={15} /> Filtros</button></div></div>
          <div className="gestor-tabs">{[["todos","Todos"],["atrasados","Atrasados"],["hoje","Hoje"],["aguardando","Aguardando"],["concluidos","Concluídos"]].map(([v,l]) => <button key={v} className={filter === v ? "active" : ""} onClick={() => setFilter(v)}>{l}</button>)}</div>
          {filtered.length === 0 ? <div className="gestor-empty"><Target size={30} /><h4>{followups.length ? "Nenhuma tarefa encontrada" : "Seu Gestor está pronto"}</h4><p>{followups.length ? "Tente outro filtro ou termo de busca." : "Crie seu primeiro follow-up para começar a organizar os retornos do dia."}</p><button className="btn-primary" onClick={openNew}><Plus size={16} /> Criar primeiro follow-up</button></div> : <div className="followup-scroll"><div className="followup-list">
            {filtered.map((f) => {
              const overdue = f.status !== "completed" && (f.date < today || (f.date === today && (f.time || "23:59") < nowTime));
              const typeItem = FOLLOWUP_TYPES.find((x) => x.value === f.type) || FOLLOWUP_TYPES[FOLLOWUP_TYPES.length - 1];
              const priority = PRIORITIES[f.priority] || PRIORITIES.media; const status = STATUS_META[f.status] || STATUS_META.pending;
              return <div className={"followup-row" + (overdue ? " is-overdue" : "") + (f.status === "completed" ? " is-completed" : "")} key={f.id}>
                <div className="followup-avatar">{getClientName(f).trim().charAt(0).toUpperCase()}</div><div className="followup-client"><strong>{getClientName(f)}</strong><span>{f.clientId ? "Cliente cadastrado" : "Contato avulso"}</span></div><div className="followup-main"><strong>{f.subject}</strong><span>{f.notes || "Sem observações"}</span></div><div className="followup-date"><strong>{dateLabel(f.date)}</strong><span><Clock size={12} /> {f.time || "Sem horário"}</span></div><span className={"priority-badge " + priority.className}>{priority.label}</span><span className="type-badge gestor-type"><FollowupTypeIcon type={f.type} size={13} />{typeItem.label}</span><span className={"status-badge " + status.className}>{overdue ? "Atrasado" : status.label}</span><div className="followup-actions"><button className="icon-btn ghost" onClick={() => openEdit(f)} title="Editar"><Pencil size={15} /></button>{f.status === "completed" ? <button className="icon-btn ghost success-icon" onClick={() => reopen(f.id)} title="Reabrir"><RefreshCw size={15} /></button> : <button className="icon-btn ghost success-icon" onClick={() => complete(f.id)} title="Concluir"><CheckCircle size={16} /></button>}<button className="icon-btn ghost" onClick={() => remove(f.id)} title="Excluir"><MoreHorizontal size={16} /></button></div>
              </div>;
            })}
          </div></div>}

          <div className="side-card"><div className="side-card-head"><div><span className="eyebrow"><CalendarClock size={13} /> HOJE</span><h3>Resumo do dia</h3></div><span className="today-pill">{dateLabel(today)}</span></div><div className="mini-tasks"><div><span className="mini-dot red" /> Ações atrasadas <b>{computed.overdue.length}</b></div><div><span className="mini-dot orange" /> Para fazer hoje <b>{computed.todayItems.length}</b></div><div><span className="mini-dot yellow" /> Aguardando clientes <b>{computed.waiting.length}</b></div><div><span className="mini-dot green" /> Concluídos hoje <b>{computed.completedToday.length}</b></div></div></div>
          <div className="side-card tip-card"><div className="tip-icon"><Bell size={18} /></div><div><b>Dica do Gestor</b><p>Quando um cliente disser que vai pensar e retornar depois, crie um follow-up para não deixar a oportunidade esfriar.</p></div></div>
          <div className="side-card quick-card"><h3>Ações rápidas</h3><button onClick={() => { resetDraft(); setDraft((d) => ({ ...d, type: "responder", subject: "Responder cliente" })); setShowForm(true); }}><MessageCircle size={16} /> Responder cliente <ChevronRight size={15} /></button><button onClick={() => { resetDraft(); setDraft((d) => ({ ...d, type: "ligar", subject: "Ligar para cliente" })); setShowForm(true); }}><Phone size={16} /> Fazer ligação <ChevronRight size={15} /></button><button onClick={() => { resetDraft(); setDraft((d) => ({ ...d, type: "proposta", subject: "Enviar proposta" })); setShowForm(true); }}><Send size={16} /> Enviar proposta <ChevronRight size={15} /></button></div>
        </aside>
      </div>
      {showForm && <Modal title={editing ? "Editar follow-up" : "Novo follow-up"} onClose={() => { setShowForm(false); setEditing(null); }}><form className="form gestor-form" onSubmit={save}>
        <Field label="Cliente / contato"><div className="client-select-row"><select value={draft.clientId} onChange={(e) => setDraft({ ...draft, clientId: e.target.value, guestName: e.target.value ? "" : draft.guestName })}><option value="">Cliente não cadastrado / avulso</option>{clients.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}</select><button type="button" className="icon-btn add-client-btn" title="Criar cliente" onClick={() => { const name = window.prompt("Nome do novo cliente / contato:"); if (name && name.trim() && onAddClient) { const c = { id: uid("c"), name: name.trim(), document: "", address: "", type: "presencial", phone: "", email: "", since: todayISO() }; onAddClient(c); setDraft({ ...draft, clientId: c.id, guestName: "" }); } }}><UserPlus size={17} /></button></div></Field>
        {!draft.clientId && <Field label="Nome do cliente / contato (opcional)"><input placeholder="Ex.: Bruno ou Empresa XYZ" value={draft.guestName} onChange={(e) => setDraft({ ...draft, guestName: e.target.value })} /></Field>}
        <Field label="Assunto / tarefa"><input autoFocus placeholder="Ex.: Fazer follow-up sobre transferência do CNPJ" value={draft.subject} onChange={(e) => setDraft({ ...draft, subject: e.target.value })} required /></Field>
        <Field label="Observação (opcional)"><textarea className="textarea" placeholder="Detalhes importantes sobre a tarefa..." value={draft.notes} onChange={(e) => setDraft({ ...draft, notes: e.target.value })} /></Field>
        <div className="form-row"><Field label="Data"><input type="date" value={draft.date} onChange={(e) => setDraft({ ...draft, date: e.target.value })} required /></Field><Field label="Horário"><input type="time" value={draft.time} onChange={(e) => setDraft({ ...draft, time: e.target.value })} /></Field></div>
        <Field label="Prioridade"><div className="priority-selector">{Object.entries(PRIORITIES).map(([v,p]) => <button type="button" key={v} className={"priority-choice " + p.className + (draft.priority === v ? " selected" : "")} onClick={() => setDraft({ ...draft, priority: v })}>{p.label}</button>)}</div></Field>
        <Field label="Tipo"><select value={draft.type} onChange={(e) => setDraft({ ...draft, type: e.target.value })}>{FOLLOWUP_TYPES.map((t) => <option key={t.value} value={t.value}>{t.label}</option>)}</select></Field>
        <Field label="Status"><select value={draft.status} onChange={(e) => setDraft({ ...draft, status: e.target.value })}><option value="pending">Pendente</option><option value="waiting">Aguardando cliente</option><option value="completed">Concluído</option></select></Field>
        <Field label="Repetir"><select value={draft.repeat} onChange={(e) => setDraft({ ...draft, repeat: e.target.value })}><option value="none">Não repetir</option><option value="daily">Todos os dias</option><option value="weekly">Toda semana</option><option value="monthly">Todo mês</option></select></Field>
        <div className="form-actions"><button type="button" className="btn-secondary" onClick={() => setShowForm(false)}>Cancelar</button><button className="btn-primary" type="submit"><Save size={16} /> {editing ? "Salvar alterações" : "Salvar follow-up"}</button></div>
      </form></Modal>}
    </div>
  );
}
