<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NL Sales</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Inter,Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}
button{font:inherit;cursor:pointer}
.app{display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{
  width:245px;
  background:#101b35;
  color:#fff;
  padding:22px 16px;
  display:flex;
  flex-direction:column;
  flex-shrink:0;
}
.brand{
  display:flex;
  align-items:center;
  gap:11px;
  padding:4px 10px 28px;
}
.logo{
  width:40px;height:40px;
  border-radius:11px;
  background:#20c997;
  display:grid;
  place-items:center;
  font-weight:800;
  color:#102039;
}
.brand strong{font-size:19px}
.brand span{display:block;font-size:11px;color:#94a3b8;margin-top:2px}

.menu-title{
  color:#71809c;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1.2px;
  padding:10px 12px 8px;
}
.menu button{
  width:100%;
  border:0;
  background:transparent;
  color:#aeb9cf;
  text-align:left;
  padding:11px 13px;
  border-radius:9px;
  margin-bottom:3px;
  display:flex;
  align-items:center;
  gap:12px;
}
.menu button:hover,
.menu button.active{
  background:#1c2b4d;
  color:#fff;
}
.icon{width:20px;text-align:center}

.sidebar-bottom{
  margin-top:auto;
  border-top:1px solid #263451;
  padding-top:15px;
}
.company{
  padding:10px;
  display:flex;
  gap:10px;
  align-items:center;
}
.avatar{
  width:34px;height:34px;border-radius:50%;
  background:#273b62;
  display:grid;place-items:center;
  font-size:13px;font-weight:700;
}
.company small{display:block;color:#8190aa;font-size:10px}
.company strong{font-size:12px}

/* MAIN */
.main{flex:1;min-width:0}
.topbar{
  height:72px;
  background:#fff;
  border-bottom:1px solid #e7ebf2;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
}
.search{
  width:330px;
  background:#f5f7fb;
  border:1px solid #e9edf4;
  border-radius:10px;
  padding:10px 14px;
  color:#8994a8;
  font-size:13px;
}
.top-right{display:flex;align-items:center;gap:20px}
.notification{font-size:20px;color:#68758b}
.user{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:13px;
}
.user .avatar{width:32px;height:32px}

.content{padding:28px 30px 45px}
.page-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:25px;
}
.page-head h1{font-size:25px;margin-bottom:5px}
.page-head p{font-size:13px;color:#7c879a}
.primary{
  border:0;
  background:#16b982;
  color:#fff;
  border-radius:9px;
  padding:11px 17px;
  font-weight:700;
}
.primary:hover{background:#0fa875}

/* CARDS */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:20px;
}
.card{
  background:#fff;
  border:1px solid #e9edf3;
  border-radius:14px;
  padding:20px;
  box-shadow:0 2px 7px rgba(20,35,60,.03);
}
.kpi-label{font-size:12px;color:#7d899c}
.kpi-value{font-size:27px;font-weight:750;margin:9px 0 4px}
.kpi-foot{font-size:11px;color:#19a974}

.two{
  display:grid;
  grid-template-columns:1.55fr 1fr;
  gap:20px;
}
.card-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}
.card-title h3{font-size:15px}
.card-title span{font-size:11px;color:#8994a8}

.conversation{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 0;
  border-top:1px solid #eef1f5;
}
.conversation:first-of-type{border-top:0}
.conversation .avatar{flex-shrink:0}
.conv-info{flex:1}
.conv-info strong{font-size:13px}
.conv-info p{font-size:11px;color:#8994a8;margin-top:4px}
.status{
  font-size:10px;
  padding:5px 8px;
  border-radius:20px;
  white-space:nowrap;
}
.red{background:#fff0f0;color:#d74b4b}
.orange{background:#fff4e7;color:#d98222}
.yellow{background:#fff9dc;color:#a27c00}
.green{background:#e9fbf3;color:#159765}

.flow{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}
.flow span{
  padding:7px 9px;
  border-radius:7px;
  background:#f0f3f8;
  font-size:10px;
  color:#68758b;
}
.flow span.on{background:#dff8ee;color:#12966a;font-weight:700}

.activity{
  display:flex;
  gap:12px;
  padding:11px 0;
  border-bottom:1px solid #eef1f5;
}
.activity:last-child{border:0}
.dot{width:8px;height:8px;border-radius:50%;background:#18b983;margin-top:5px}
.activity p{font-size:12px}
.activity small{font-size:10px;color:#99a2b1}

/* MODULE */
.module-card{
  background:#fff;
  border:1px solid #e8edf3;
  border-radius:14px;
  padding:22px;
}
.module-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}
.action-card{
  border:1px solid #e8edf3;
  border-radius:12px;
  padding:18px;
  background:#fff;
}
.action-card h3{font-size:14px;margin-bottom:7px}
.action-card p{font-size:12px;color:#7e899b;line-height:1.5}
.action-card button{
  margin-top:14px;
  border:1px solid #dfe5ee;
  background:#fff;
  padding:8px 11px;
  border-radius:7px;
  font-size:11px;
}
.training{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}
textarea,input{
  width:100%;
  border:1px solid #dfe5ee;
  border-radius:9px;
  padding:11px;
  outline:none;
  margin-top:8px;
}
textarea{min-height:140px;resize:vertical}
.save{
  margin-top:10px;
  border:0;
  background:#101b35;
  color:#fff;
  padding:10px 15px;
  border-radius:8px;
}
.notice{
  background:#f0f7ff;
  border:1px solid #dbeafe;
  color:#41627f;
  padding:13px;
  border-radius:9px;
  font-size:11px;
  line-height:1.5;
}

/* MOBILE */
@media(max-width:900px){
  .sidebar{width:205px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .two,.training{grid-template-columns:1fr}
  .module-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:650px){
  .sidebar{display:none}
  .topbar{padding:0 15px}
  .search{width:190px}
  .content{padding:20px 15px}
  .grid,.module-grid{grid-template-columns:1fr}
  .page-head{gap:12px}
}
</style>
</head>

</div>
